# 診断を自動で回すワークフロー(GitHub Actions)
# - プルリク・main への push・毎日の定期実行・手動実行で動く
# - コード/依存/設定/秘密情報の診断は、ネットワーク越しの攻撃はせず、リポジトリを読むだけ
# - ZAP(Web アプリへの診断)は、検証環境の URL を設定したときだけ動く。本番には向けない
name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"   # 毎日 03:17(日本時間)
  workflow_dispatch:

permissions:
  contents: read            # 最小権限。書き込み権限は与えない

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 定義のズレ検知: shared/taxonomy.json を唯一の定義として、各ツール
  # (netcheck / vuln_triage / detections) が追従しているかを確認する。
  # 「片方だけ更新して他方を忘れる最新化漏れ」をここで止める。Docker 不要で速い。
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 整合性チェック（最新化漏れの検出）
        run: |
          set -o pipefail
          python3 -I tools/check_consistency.py | tee -a "$GITHUB_STEP_SUMMARY"

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # gitleaks が履歴も調べるため

      - name: 出力先を作る
        run: mkdir -p results

      # --- コードの弱点(SQL インジェクション等) -----------------------------
      # --config auto は、メトリクスを切った状態(--metrics=off)では使えず、エラーで終わって、何も診断されない
      # (2026-10-31 に、Actions のログで確認: "Cannot create auto config when metrics are off")。
      # 公式の標準ルールセット p/default を、明示的に指定する。意図的に脆弱なデモアプリ(sqli-lab の
      # vulnerable_app.py)は、診断の対象から外す。失敗しても CI は止めないが、結果ファイルができなかったら警告を出す。
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --exclude security-scan/sqli-lab/vulnerable_app.py \
            --json --output results/semgrep.json --metrics=off || true
          [ -f results/semgrep.json ] || echo "::warning::Semgrep の結果ファイルができませんでした(診断が実行されていません)"

      # --- 部品の既知の脆弱性・設定の不備・秘密情報 -------------------------
      - name: Trivy (脆弱性 / 設定 / 秘密情報)
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest \
            fs --scanners vuln,misconfig,secret --format json --output results/trivy.json . || true

      # --- 秘密情報の混入(履歴を含む) -----------------------------------------
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --report-format=json --report-path=/repo/results/gitleaks.json \
            --exit-code=0 --no-banner || true

      # --- 依存関係の既知の脆弱性(OSV.dev に、版を照合する) ---------------------
      # git で管理されている requirements*.txt / package-lock.json / packages.lock.json /
      # *.csproj / poetry.lock / uv.lock / go.sum を自動で探して照合する。パッケージ名と版を OSV.dev(読み取り専用の公開 API)に
      # 送るだけで、攻撃はしない。対象のファイルが無ければ、何もせず終わる。
      # 既定では CI を止めない(他の診断と同じ)。止めたいときは、リポジトリ変数
      # DEP_CVE_FAIL を true にする(脆弱性あり=1、確認できなかったものあり=2 で失敗)。
      # 出力は SARIF(results/dep_cve.json)。「脆弱性トリアージ」ページに読み込め、
      # 下の「集計」ステップ(scripts/summarize.py)の要約と --fail-on にも含まれる。
      - name: 依存関係の既知の脆弱性 (OSV)
        env:
          DEP_CVE_FAIL: ${{ vars.DEP_CVE_FAIL }}
        run: |
          set +e
          args=()
          while IFS= read -r f; do
            case "$f" in
              */package-lock.json|package-lock.json) args+=(--npm-lock "$f") ;;
              */packages.lock.json|packages.lock.json) args+=(--nuget-lock "$f") ;;
              *.csproj) args+=(--csproj "$f") ;;
              */poetry.lock|poetry.lock) args+=(--poetry-lock "$f") ;;
              */uv.lock|uv.lock) args+=(--uv-lock "$f") ;;
              */go.sum|go.sum) args+=(--go-sum "$f") ;;
              *) args+=(--requirements "$f") ;;
            esac
          done < <(git ls-files | grep -E '(^|/)(requirements[^/]*\.txt|package-lock\.json|packages\.lock\.json|poetry\.lock|uv\.lock|go\.sum)$|\.csproj$')
          if [ "${#args[@]}" -eq 0 ]; then
            echo "依存関係の照合: 対象のファイルがありません(スキップ)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -I scripts/dep_cve_check.py "${args[@]}" --out results/dep_cve.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 1 ] && echo "::warning::依存関係に、既知の脆弱性があります(results/dep_cve.json)"
          [ "$rc" -eq 2 ] && echo "::warning::OSV に確認できなかったパッケージがあります。「脆弱性なし」ではありません"
          if [ "$DEP_CVE_FAIL" = "true" ]; then exit "$rc"; fi
          exit 0

      # --- 検出された CVE の詳細(GitHub Security Advisory の構造化データ) -----------
      # 上の照合で見つかった CVE について、影響版・修正版・CWE・CVSS を GitHub の公開
      # Advisories API から取得し、要約せずそのまま転記した Markdown を作る
      # (results/ghsa_report.md。アーティファクトに保存される)。照合の結果が無ければ何もしない。
      # GITHUB_TOKEN で認証して呼ぶ(未認証より、レート制限が緩い)。調べる件数は 20 件まで。
      # CI は止めない(GHSA に無い CVE などは、レポートの「取得できなかったもの」に載る)。
      - name: 検出された CVE の詳細 (GHSA)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ ! -f results/dep_cve.json ]; then
            echo "GHSA の取得: 依存関係の照合結果が無いためスキップ" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -I scripts/ghsa_lookup.py --cve-from-sarif results/dep_cve.json --max 20 \
            --out results/ghsa_report.md 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # --- Web アプリへの診断(検証環境のみ) -------------------------------------
      # リポジトリ変数 STAGING_URL に、ダミーデータの検証環境の URL を設定したときだけ動く。
      # ここは受け身の診断(baseline)。攻撃的な full scan は、別途、許可を取って手動で行う。
      - name: ZAP baseline (検証環境のみ)
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          chmod 777 results
          docker run --rm -v "$PWD/results:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ vars.STAGING_URL }}" -J zap.json || true

      # --- sqli-lab の自己リグレッション検査(このリポジトリの脆弱性診断ではない) ---
      # vulnerable_app.py は意図的に脆弱なデモアプリで、このリポジトリ自身のコードでは
      # ない。ここで検査しているのは「ラボ自身の検出スクリプトが壊れていないか」のみ。
      # 詳細: security-scan/sqli-lab/README.ja.md の TODO セクション参照。
      - name: sqli-lab のリグレッションテスト
        run: |
          pip install --quiet flask requests markupsafe
          python3 security-scan/sqli-lab/run_regression.py --out results/sqli_lab.json || true

      # --- hackingBuddyGPTのapi_baseバグに関する、本リポジトリの記録のカナリア ---
      # 「このリポジトリの脆弱性」でも「hackingBuddyGPTの脆弱性」でもない。upstream の
      # 現在のmainを毎回クローンし、本リポジトリがsecurity-scan/hackingbuddygpt-local-
      # backend-notes.mdに記録した挙動(api_base設定項目が死んでいる、OPENAI_API_BASE
      # 環境変数で回避できる)が今も成立しているかだけを確認する。失敗してもCI自体は
      # 止めない(upstream起因の失敗でジョブを赤くしないため)。
      - name: hackingBuddyGPT api_base バグの記録カナリア
        run: |
          set +e
          rm -rf /tmp/hbgpt-canary
          git clone --depth 1 https://github.com/ipa-lab/hackingBuddyGPT /tmp/hbgpt-canary
          pip install --quiet litellm httpx pydantic PyYAML python-dotenv rich tenacity \
            fabric asyncssh Mako requests pypsexec beautifulsoup4 faker mcp
          python3 security-scan/hackingbuddygpt-local-poc/run_regression.py \
            --hbgpt-src /tmp/hbgpt-canary/src --out results/hackingbuddygpt_regression.json
          exit 0

      - name: 集計(要約を表示)
        run: |
          sudo chown -R "$(id -u):$(id -g)" results || true
          python3 scripts/summarize.py results --fail-on "${{ vars.FAIL_ON || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/summarize.py results --fail-on "${{ vars.FAIL_ON || 'none' }}"

      - name: 結果を保存(「脆弱性トリアージ」ページに読み込める)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            results/*.json
            results/ghsa_report.md
          retention-days: 30
