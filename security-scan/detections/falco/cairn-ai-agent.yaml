# Falco ルール: 自律AIエージェント攻撃ハーネス（Cairn 等）のランタイム検知
# 検知コンテンツのみ。閾値・allowlist は環境に合わせて調整すること。
#
# 配置例: /etc/falco/rules.d/cairn-ai-agent.yaml
# 注意: マクロ/フィールドは Falco のバージョンに依存。自環境の falco --list で確認。

- list: ai_agent_known_worker_images
  items:
    - "ghcr.io/oritera/cairn-worker-container"
    - "ghcr.io/usestrix/strix-sandbox"

# R2: 特権 / raw-socket / host ネットのコンテナ起動
- rule: AI Agent Privileged Worker Container Started
  desc: >
    Container started with NET_RAW/NET_ADMIN, privileged, or host network —
    consistent with Cairn/Strix worker sandboxes. Correlate with unknown images.
  condition: >
    container_started and container
    and (thread.cap_permitted contains CAP_NET_RAW
         or thread.cap_permitted contains CAP_NET_ADMIN
         or proc.args contains "--privileged"
         or container.privileged = true
         or proc.args contains "--network=host"
         or proc.args contains "--net=host")
  output: >
    Privileged/raw-socket/host-net container started
    (image=%container.image.repository tag=%container.image.tag
     name=%container.name priv=%container.privileged
     caps=%thread.cap_permitted cmd=%proc.cmdline)
  priority: WARNING
  tags: [container, mitre_execution, T1610, ai_agent]

# R1/R4: コンテナ内プロセスから LLM / メッセージング API への外向き接続
- list: ai_agent_egress_domains
  items:
    - "api.openai.com"
    - "api.anthropic.com"
    - "api.openrouter.ai"
    - "api.deepseek.com"
    - "api.telegram.org"
    - "discord.com"
    - "hooks.slack.com"

- rule: AI Agent Container Outbound To LLM Or Messaging API
  desc: >
    Outbound connection from a container to an external LLM or messaging API.
    High-signal when it originates from a server/worker container that has no
    approved LLM/ChatOps use. Tune the domain list to an allowlist model.
  condition: >
    outbound and container
    and fd.sip.name in (ai_agent_egress_domains)
  output: >
    Container egress to LLM/messaging API
    (image=%container.image.repository dest=%fd.sip.name:%fd.sport
     proc=%proc.name cmd=%proc.cmdline)
  priority: NOTICE
  tags: [network, mitre_command_and_control, T1071, T1041, ai_agent]

# R5: コンテナ内での永続化（cron / systemd）作成
- rule: AI Agent Persistence Via Cron Or Systemd
  desc: Creation of cron/systemd persistence from inside a container or by an agent process.
  condition: >
    (open_write or rename) and fd.name pmatch
      (/etc/cron.*, /var/spool/cron/*, /etc/crontab, /etc/systemd/system/*)
  output: >
    Persistence file written (file=%fd.name proc=%proc.name
     pcmd=%proc.pcmdline container=%container.name)
  priority: WARNING
  tags: [persistence, mitre_persistence, T1053, ai_agent]

# R7: 多種のセキュリティツールの起動（単発。短時間での多様さは SIEM 相関側で評価）
# ※ ローカルLLM 利用でネットワーク egress が出ないエージェントでも残る挙動シグナル。
- list: ai_agent_security_tools
  items: [nmap, ffuf, gobuster, nikto, sqlmap, hydra, nuclei, wpscan, msfconsole, medusa, enum4linux]

- rule: AI Agent Security Tool Executed
  desc: >
    A known offensive security tool was executed. Low severity on its own;
    the high-signal pattern is many DISTINCT tools from one parent in a short
    window (evaluate via SIEM correlation / R7). Correlate with container and
    recon signals.
  condition: >
    spawned_process and proc.name in (ai_agent_security_tools)
  output: >
    Security tool executed (tool=%proc.name parent=%proc.pname
     container=%container.name image=%container.image.repository cmd=%proc.cmdline)
  priority: NOTICE
  tags: [execution, mitre_execution, T1059, T1046, ai_agent]

# R8: Web シェルの設置と、Web サーバーからのシェル起動
# （JPCERT/CC 注意喚起 2026-10-08/09: アプリケーションサーバー上に WAR が置かれ、JSP が簡易 Web シェルとして動作）
# 単体では誤検知が出うる。デプロイ用のユーザー・ツールを allowlist 化し、設置と起動を相関させる。
- list: r8_web_server_procs
  items: [java, nginx, httpd, apache2, php-fpm, php-fpm7, php-fpm8, w3wp]

- list: r8_shell_names
  items: [sh, bash, dash, zsh, ash, ksh, csh, tcsh]

- list: r8_deploy_procs
  items: [dpkg, rpm, yum, dnf, apt, apt-get]

- rule: R8 Web Server Spawns Shell
  desc: >
    A web/application server process started a command shell. Normal request
    handling rarely does this; a web shell does it to run commands. Allowlist
    applications that deliberately shell out (backup/report/batch jobs).
  condition: >
    spawned_process and proc.pname in (r8_web_server_procs)
    and proc.name in (r8_shell_names)
  output: >
    Shell spawned by web server (parent=%proc.pname shell=%proc.name
     cmd=%proc.cmdline pcmd=%proc.pcmdline user=%user.name
     container=%container.name image=%container.image.repository)
  priority: WARNING
  tags: [execution, persistence, mitre_execution, mitre_persistence, T1059, T1505, webshell]

- rule: R8 Executable Web Content Written Under Web Root
  desc: >
    A server-side executable file (JSP/WAR/PHP/ASPX) was written under a common
    web root. Allowlist deploy tooling and the deploy user; correlate with the
    spawn rule above.
  condition: >
    open_write and not proc.name in (r8_deploy_procs)
    and fd.name pmatch (/var/www/*, /usr/share/nginx/*, */webapps/*, */htdocs/*, */wwwroot/*)
    and (fd.name endswith ".jsp" or fd.name endswith ".jspx" or fd.name endswith ".war"
         or fd.name endswith ".php" or fd.name endswith ".phtml"
         or fd.name endswith ".aspx" or fd.name endswith ".ashx")
  output: >
    Executable web content written (file=%fd.name proc=%proc.name
     pcmd=%proc.pcmdline user=%user.name container=%container.name)
  priority: WARNING
  tags: [persistence, mitre_persistence, T1505, webshell]
