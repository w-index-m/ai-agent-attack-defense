# DRAFT. Medium confidence on the exact method names (cloudquotas v1).
title: DRAFT - GCP quota increase requested
id: draft-gcp-quota-0004
status: experimental
description: >
  DRAFT. The Mandiant case requested quota increases for GPU hardware to run additional compute
  instances and sustain unauthorized AI workloads. This rule cannot see WHICH quota; it flags any
  quota preference creation/update, so expect legitimate hits.
references:
  - ../../cloud-audit-check-notes.md
author: ai-agent-attack-defense
date: 2026/11/14
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name|endswith:
      - '.CreateQuotaPreference'
      - '.UpdateQuotaPreference'
  condition: selection
falsepositives:
  - Capacity planning by the owning team.
level: low
tags:
  - attack.impact
  - attack.t1496
