# DRAFT. Medium confidence on the exact method names (serviceusage v1).
title: DRAFT - GCP AI-related API enabled
id: draft-gcp-ai-api-0003
status: experimental
description: >
  DRAFT. The Mandiant case enabled Generative Language / Gemini-related settings and provisioned AI
  workloads on a victim project (LLMjacking: using someone else's cloud for unauthorized AI work).
references:
  - ../../cloud-audit-check-notes.md
author: ai-agent-attack-defense
date: 2026/11/14
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection_method:
    gcp.audit.method_name|endswith:
      - '.EnableService'
      - '.BatchEnableServices'
  selection_api:
    protoPayload.request|contains:
      - 'generativelanguage.googleapis.com'
      - 'aiplatform.googleapis.com'
  condition: selection_method and selection_api
falsepositives:
  - A team legitimately starting to use these APIs.
level: medium
tags:
  - attack.impact
  - attack.t1496
