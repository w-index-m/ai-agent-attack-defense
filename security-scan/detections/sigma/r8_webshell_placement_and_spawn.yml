title: Web server process spawns a shell
id: 9b4e1a67-2d35-4c80-b6f3-5a7d0c9e1f24
status: experimental
description: >
  R8 (spawn). Detects a web or application server process (Tomcat/Java, nginx,
  Apache, PHP-FPM) starting a command shell. Normal request handling rarely
  starts a shell; a web shell does so to run commands. Correlate with R8
  (placement) above and with the writing user or request source.
references:
  - https://www.jpcert.or.jp/at/2026/at260030.html
author: ai-agent-attack-defense
date: 2026/10/11
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '/java'
      - '/nginx'
      - '/httpd'
      - '/apache2'
      - '/php-fpm'
      - '/php-fpm7'
      - '/php-fpm8'
  selection_child:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
  condition: selection_parent and selection_child
fields:
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
falsepositives:
  - Applications that deliberately shell out (backup, report, or batch jobs started by the web app, health-check scripts). Allowlist by parent command line.
  - Java-based tools that are not web servers (build agents, IDEs) on the same host.
level: high
tags:
  - attack.execution
  - attack.persistence
  - attack.t1059.004
  - attack.t1505.003
