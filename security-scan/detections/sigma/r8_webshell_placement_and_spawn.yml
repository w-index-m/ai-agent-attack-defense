title: Executable web content written under a web root
id: 3c8f5d2e-6a41-4b7e-9d0a-8e1f2b7c4a58
status: experimental
description: >
  R8 (placement). Detects creation of server-side executable content (JSP, WAR,
  PHP, ASPX and similar) under common web roots. A web shell is typically placed
  as such a file on a server reachable from a public web server (JPCERT/CC
  advisory of 2026-10-08/09 reports a WAR file with a JSP acting as a simple web
  shell). Correlate with who wrote the file and with R8 (spawn) below.
references:
  - https://www.jpcert.or.jp/at/2026/at260030.html
author: ai-agent-attack-defense
date: 2026/10/11
logsource:
  product: linux
  category: file_event
detection:
  selection_root:
    TargetFilename|contains:
      - '/var/www/'
      - '/usr/share/nginx/'
      - '/webapps/'
      - '/htdocs/'
      - '/wwwroot/'
  selection_ext:
    TargetFilename|endswith:
      - '.jsp'
      - '.jspx'
      - '.war'
      - '.php'
      - '.phtml'
      - '.aspx'
      - '.ashx'
  filter_deploy_tooling:
    Image|endswith:
      - '/dpkg'
      - '/rpm'
      - '/yum'
      - '/dnf'
      - '/apt'
      - '/apt-get'
  condition: selection_root and selection_ext and not filter_deploy_tooling
fields:
  - TargetFilename
  - Image
  - User
  - ParentImage
falsepositives:
  - Legitimate application deployments (CI/CD, tomcat manager, package installs). Allowlist the deploy user and deploy tooling in your environment.
  - Content management systems that create PHP files on plugin or theme updates.
level: high
tags:
  - attack.persistence
  - attack.t1505.003
