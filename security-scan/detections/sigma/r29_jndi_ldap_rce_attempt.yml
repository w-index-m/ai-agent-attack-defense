title: Application process makes an outbound LDAP/RMI connection shortly after an inbound request (possible JNDI injection RCE)
id: 8a5e2f91-4c7b-4d3a-b91e-r29jndirce000
status: experimental
description: >
  Detects the classic JNDI-injection remote-code-execution pattern (e.g.
  Log4Shell, CVE-2021-44228, and the general class of "attacker-controlled
  string reaches a JNDI lookup" bugs): a server-side application process
  opens a new outbound connection to an LDAP (389/636) or RMI (1099, or a
  high ephemeral port used by rogue JNDI servers) port, immediately after
  handling an inbound request. The standalone offensive toolkits for this
  (e.g. the welk1n-style JNDI-Injection-Exploit family, which stand up an
  RMI/LDAP/HTTP server to serve a payload) are widely available and were
  found, alongside Claude Code/DeepSeek/GLM/Grok model-routing
  configuration and 19 custom agent skills, on an exposed relay server
  tied by Hunt.io (2026-11-04) to a campaign against seven South Korean
  banks that used the ARTEX autonomous-pentest agent (this repo's own
  artex-analysis.ja.md tracks ARTEX; the Korea-banking link is reported
  but, per Hunt.io and Korean police coverage, ARTEX's exact role in that
  campaign is still unconfirmed as of this writing). Updated 2026-11-08:
  Hunt.io independently confirmed a self-contained JNDI/LDAP exploitation
  rig at a separate open directory (23.248.226.250:8001), built on the
  UnboundID LDAP SDK, with command execution verified via DNS callback
  (payload retrieved 2026-10-05 03:42 UTC); secondary coverage of this
  rig does not itself enumerate specific LDAP/RMI port numbers beyond
  "LDAP", so this rule's 389/636/1099 port selection remains this repo's
  own standard-JNDI-practice assumption, not a value Hunt.io published.
  Separately, CrowdStrike has reportedly attributed the bank intrusions
  to a China-based operator (also said to have used Claude Code), per
  secondary source coverage -- an independent attribution chain from
  Hunt.io's own ARTEX-console-to-relay-server inference, and still not
  confirmed by Korean police. This rule detects the RCE technique itself,
  independent of which tool or agent drove it.
references:
  - https://hunt.io/blog/artex-south-korea-bank-infrastructure
  - ../artex-analysis.ja.md
  - https://nvd.nist.gov/vuln/detail/CVE-2021-44228
author: ai-agent-attack-defense
date: 2026/11/06
logsource:
  category: network_connection
  product: linux
detection:
  selection_parent:
    Image|endswith:
      - '/java'
      - '/tomcat'
      - '/catalina.sh'
  selection_dest_port:
    DestinationPort:
      - 389
      - 636
      - 1099
  filter_known_directory_services:
    DestinationHostname|contains:
      - '.internal.example'  # 自社の正規の LDAP/AD サーバーのホスト名に置き換えること
  condition: selection_parent and selection_dest_port and not filter_known_directory_services
fields:
  - Image
  - DestinationIp
  - DestinationHostname
  - DestinationPort
  - User
falsepositives:
  - Applications that legitimately use LDAP for authentication (LDAP bind to a known corporate directory server) -- allowlist the known-good LDAP/AD server hostnames/IPs for your environment in filter_known_directory_services.
  - Java RMI used for legitimate inter-process communication (e.g. JMX monitoring) on 1099 within a trusted internal segment -- correlate with whether the connection followed an actual inbound request, not just periodic polling.
level: high
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059
