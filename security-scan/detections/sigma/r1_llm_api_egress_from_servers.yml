title: Server-zone host contacting an external LLM API
id: 7b1f0a2c-1d3e-4a6b-9c01-r1llmegress00
status: experimental
description: >
  Detects outbound connections from server/production hosts to known external
  LLM API endpoints. Autonomous AI-agent attack harnesses (Strix/Cairn/Hermes)
  require continuous LLM inference, so LLM-API egress from a host that has no
  legitimate LLM use is a high-signal indicator. Tune src-zone and the domain
  allowlist to your environment. The decision-making model's vendor does not
  matter for this rule (e.g. Gemma served via Groq's inference API is still
  LLM egress) -- only known API endpoints are listed here; a fully local model
  (no network egress at all) is not covered by this rule (see R7 instead).
  Updated 2026-11-08: Gambit Security's report (its own recovered exposed
  attacker staging server, dated 2026-09-22, "Autonomous AI Agents are
  breaking into hundreds of Online Retailers for $25 a target in an
  ongoing campaign") is Gambit's own primary account of an incident it
  discovered, not a secondary report of someone else's finding, confirmed
  via multiple independent secondary outlets quoting the same report
  (gambit.security direct fetch is blocked in this sandbox).
references:
  - https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company
author: ai-agent-attack-defense
date: 2026/10/06
logsource:
  category: proxy
detection:
  selection_domain:
    dest_host:
      - 'api.openai.com'
      - 'api.anthropic.com'
      - 'api.openrouter.ai'
      - 'openrouter.ai'
      - 'api.deepseek.com'
      - 'api.groq.com'
      - 'generativelanguage.googleapis.com'
  selection_zone:
    src_network_zone:
      - 'server'
      - 'production'
      - 'dmz'
  condition: selection_domain and selection_zone
fields:
  - src_ip
  - dest_host
  - user_agent
  - bytes_out
falsepositives:
  - Hosts with a legitimate, approved LLM integration (allowlist these).
level: high
tags:
  - attack.command_and_control
  - attack.t1041
