title: AI workload accessing the cloud metadata service's credential endpoint
id: 1a7e9b4c-3d5f-4e92-b6a0-r10metadata00
status: experimental
description: >
  Detects a process requesting a service-account/instance credential path
  from a cloud metadata service (169.254.169.254, metadata.google.internal,
  etc.) from inside an AI agent's execution context (a code-interpreter
  tool, an Agent Engine runtime, a container running an agent). This is the
  mechanism Unit 42 demonstrated in "Double Agents: Exposing Security Blind
  Spots in GCP Vertex AI" (2026-03-31) and in their CrewAI/AutoGen study's
  "service account access token exfiltration via metadata service" scenario
  — a tool running inside the agent reaches the metadata endpoint and steals
  the workload's own service-agent token. Tune the process/user allowlist:
  legitimate SDKs (cloud client libraries) also call this endpoint, so this
  rule is most useful scoped to hosts/containers you have specifically
  tagged as running agent code.
references:
  - https://unit42.paloaltonetworks.com/
author: ai-agent-attack-defense
date: 2026-10-16
logsource:
  category: proxy
detection:
  selection_dest:
    dest_host:
      - '169.254.169.254'
      - 'metadata.google.internal'
      - 'metadata'
  selection_path:
    url|contains:
      - '/computeMetadata/v1/instance/service-accounts/'
      - '/latest/meta-data/iam/security-credentials/'
      - '/metadata/identity/oauth2/token'
  selection_agent_zone:
    # Tune to however you tag hosts/containers that run agent/LLM-tool code.
    src_tag|contains:
      - 'agent'
      - 'llm-tool'
      - 'code-interpreter'
  condition: selection_dest and selection_path and selection_agent_zone
fields:
  - src_ip
  - process_name
  - dest_host
  - url
  - http_header_metadata_flavor
falsepositives:
  - Legitimate cloud SDK calls that fetch credentials as part of normal startup; most cloud client libraries cache the token and call this rarely, so a burst or an unexpected caller process is the stronger signal.
level: high
tags:
  - attack.credential_access
  - attack.t1552.005
